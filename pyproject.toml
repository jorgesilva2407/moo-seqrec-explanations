[project]
name = "seqrec"
version = "0.1.0"
description = "SASRec trained with full cross-entropy on MovieLens-20M"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.6,<3",
    "numpy>=1.26",
    "pandas>=2.2",
    "tqdm>=4.66",
]

[project.scripts]
seqrec = "seqrec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seqrec"]

[dependency-groups]
dev = ["pytest>=8"]
upload = ["huggingface_hub>=0.24"]
explain = ["huggingface_hub>=0.24", "pymoo>=0.6.1", "scipy>=1.11", "matplotlib>=3.8"]

[tool.uv]
# Groups are always requested explicitly (`uv sync --group dev`, Docker build arg).
default-groups = []

# PyTorch CUDA wheels. Keep this CUDA version identical to the Docker base image
# (see CUDA_IMAGE in the Dockerfile). To switch, change the index name and URL here
# (e.g. cu124, cu128) and the base image tag, then run `just lock`.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
# The CUDA index only has Linux wheels; macOS/Windows laptops fall back to PyPI.
torch = { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }

[tool.pytest.ini_options]
testpaths = ["tests"]
