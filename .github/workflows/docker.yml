name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Require uv.lock
        run: |
          if [ ! -f uv.lock ]; then
            echo "::error::uv.lock is missing. Run 'just lock' locally and commit uv.lock."
            exit 1
          fi

      # The CUDA PyTorch wheels make a multi-GB image; free runner disk before building.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEPENDENCY_GROUPS=dev upload
            GIT_COMMIT=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          # No gha layer cache: exporting the multi-GB CUDA layers filled the runner disk and took 40 min.

      - name: Smoke test the pushed image (no GPU needed)
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          docker run --rm "$IMAGE_REF" bash -c "seqrec --help && just --list"
